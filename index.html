<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Engineering & Art Portfolio</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="mediaqueries.css" />
    <link rel="icon" href="./assets/profile-pic.png" type="image/png">
    <style>
      .landing-container {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
        color: white;
        text-align: center;
        padding: 2rem;
      }

      .landing-title {
        font-size: 3rem;
        margin-bottom: 2rem;
        color: #fff;
      }

      .landing-subtitle {
        font-size: 1.5rem;
        margin-bottom: 3rem;
        color: #ccc;
      }

      .options-container {
        display: flex;
        gap: 2rem;
        flex-wrap: wrap;
        justify-content: center;
      }

      .option-card {
        background: rgba(255, 255, 255, 0.1);
        border-radius: 15px;
        padding: 2rem;
        width: 300px;
        transition: transform 0.3s ease, box-shadow 0.3s ease;
        cursor: pointer;
        backdrop-filter: blur(10px);
      }

      .option-card:hover {
        transform: translateY(-10px);
        box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
      }

      .option-title {
        font-size: 1.8rem;
        margin-bottom: 1rem;
        color: #fff;
      }

      .option-description {
        color: #ccc;
        margin-bottom: 1.5rem;
      }

      .option-button {
        background: #4CAF50;
        color: white;
        border: none;
        padding: 1rem 2rem;
        border-radius: 25px;
        font-size: 1.1rem;
        cursor: pointer;
        transition: background 0.3s ease;
      }

      .option-button:hover {
        background: #45a049;
      }

      @media (max-width: 768px) {
        .landing-title {
          font-size: 2rem;
        }
        
        .landing-subtitle {
          font-size: 1.2rem;
        }

        .options-container {
          flex-direction: column;
        }

        .option-card {
          width: 100%;
          max-width: 300px;
        }
      }
    </style>
  </head>
  <body>
    <div class="split-container">
      <!-- Left Side - Engineering -->
      <div class="split-side engineering-side">
        <div class="floating-icons">
          <img src="./assets/laptop.png" alt="Laptop" class="floating-icon laptop-icon">
          <img src="./assets/code.png" alt="Code" class="floating-icon code-icon">
          <img src="./assets/robot.png" alt="Robot" class="floating-icon robot-icon">
          <img src="./assets/calculator.png" alt="Calculator" class="floating-icon calculator-icon">
          <img src="./assets/python.png" alt="Python" class="floating-icon python-icon">
        </div>
        <div class="side-content">
          <h2 class="side-title">AI Engineering</h2>
          <p class="side-description">Explore my AI projects, Skills, machine learning implementations, and engineering solutions.</p>
          <button class="side-button" onclick="location.href='engineering.html'">Enter Engineering</button>
        </div>
      </div>
    
      <!-- Center Images -->
      <div class="center-images">
        <img src="./assets/brain.png" alt="Brain" class="center-image brain-image">
        <img src="./assets/heart.png" alt="Heart" class="center-image heart-image">
      </div>

      <!-- Right Side - Art -->
      <div class="split-side art-side">
        <div class="floating-icons">
          <img src="./assets/camera.png" alt="Camera" class="floating-icon camera-icon">
          <img src="./assets/film.png" alt="Film" class="floating-icon film-icon">
          <img src="./assets/sketchbook.png" alt="Sketchbook" class="floating-icon sketchbook-icon">
          <img src="./assets/pen.png" alt="Pen" class="floating-icon pen-icon">
          <img src="./assets/palette.png" alt="Palette" class="floating-icon palette-icon">
        </div>
        <div class="side-content">
          <h2 class="side-title">Creative</h2>
          <p class="side-description">Discover my creative work, films, poetry, and artistic expressions.</p>
          <button class="side-button" onclick="location.href='./artistic/art.html'">Enter Art</button>
        </div>
      </div>
        </div>
  </body>
</html>
